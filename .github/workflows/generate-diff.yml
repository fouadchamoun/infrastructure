name: Argo CD Diff Preview

on:
  pull_request:
    branches:
      - main
    paths:
      - "k8s/apps/**"
      - "k8s/bootstrap/**"
      - "k8s/charts/**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pull-request

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: main

      - name: Resolve Argo CD chart versions
        id: argocd-version
        run: |
          BASE_VERSION=$(yq '. | select(.metadata.name == "argocd") | .spec.source.targetRevision' main/k8s/bootstrap/0-argocd.yaml)
          TARGET_VERSION=$(yq '. | select(.metadata.name == "argocd") | .spec.source.targetRevision' pull-request/k8s/bootstrap/0-argocd.yaml)
          echo "Base chart version:   $BASE_VERSION"
          echo "Target chart version: $TARGET_VERSION"
          echo "base=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$BASE_VERSION" = "$TARGET_VERSION" ]; then
            echo "upgrade=false" >> "$GITHUB_OUTPUT"
          else
            echo "upgrade=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Diff (standard)
        if: steps.argocd-version.outputs.upgrade == 'false'
        run: |
          docker run \
            --network=host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v $(pwd)/main/.github/workflows/assets/argocd:/argocd-config \
            -v $(pwd)/main:/base-branch \
            -v $(pwd)/pull-request:/target-branch \
            -v $(pwd)/output:/output \
            -e TARGET_BRANCH=refs/pull/${{ github.event.number }}/merge \
            -e REPO=${{ github.repository }} \
            dagandersen/argocd-diff-preview:v0.2.17 \
            --argocd-config-dir /argocd-config \
            --argocd-chart-version ${{ steps.argocd-version.outputs.base }}

      - name: Generate Diff (Argo CD upgrade)
        if: steps.argocd-version.outputs.upgrade == 'true'
        run: |
          mkdir -p output-base output-target output

          # Run 1: render both branches with the base (current) chart version.
          # We only need the base/ app manifests from this run (main rendered with old Argo CD).
          docker run \
            --network=host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v $(pwd)/main/.github/workflows/assets/argocd:/argocd-config \
            -v $(pwd)/main:/base-branch \
            -v $(pwd)/pull-request:/target-branch \
            -v $(pwd)/output-base:/output \
            -e TARGET_BRANCH=refs/pull/${{ github.event.number }}/merge \
            -e REPO=${{ github.repository }} \
            dagandersen/argocd-diff-preview:v0.2.17 \
            --argocd-config-dir /argocd-config \
            --argocd-chart-version ${{ steps.argocd-version.outputs.base }} \
            --output-folder /output \
            --output-app-manifests

          # Run 2: render both branches with the target (new) chart version.
          # We only need the target/ app manifests from this run (PR rendered with new Argo CD).
          docker run \
            --network=host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v $(pwd)/main/.github/workflows/assets/argocd:/argocd-config \
            -v $(pwd)/main:/base-branch \
            -v $(pwd)/pull-request:/target-branch \
            -v $(pwd)/output-target:/output \
            -e TARGET_BRANCH=refs/pull/${{ github.event.number }}/merge \
            -e REPO=${{ github.repository }} \
            dagandersen/argocd-diff-preview:v0.2.17 \
            --argocd-config-dir /argocd-config \
            --argocd-chart-version ${{ steps.argocd-version.outputs.target }} \
            --output-folder /output \
            --output-app-manifests

          # Diff per application. Base rendered with old Argo CD  vs  target rendered
          # with new Argo CD. Each app gets its own <details> section, matching the
          # original tool's per-app diff layout. Each app's diff is capped at a fixed
          # number of lines so that every app (even truncated ones) appears in the
          # comment, rather than a single giant diff pushing later apps out.
          MAX_APP_DIFF_LINES=200
          {
            echo "# Argo CD Diff Preview (upgrade ${{ steps.argocd-version.outputs.base }} → ${{ steps.argocd-version.outputs.target }})"
            echo ""
            echo "> Base branch rendered with chart \`${{ steps.argocd-version.outputs.base }}\`, target branch rendered with chart \`${{ steps.argocd-version.outputs.target }}\`."
            echo ""
            for app in $(cd output-base/base && ls); do
              base_file="output-base/base/$app"
              target_file="output-target/target/$app"
              if [ ! -f "$target_file" ]; then
                # App exists on base but not on target
                base_lines=$(wc -l < "$base_file")
                echo "<details><summary>$app (_Deleted_)</summary><br>"
                echo ""
                printf '```diff\n'
                head -n "$MAX_APP_DIFF_LINES" "$base_file"
                if [ "$base_lines" -gt "$MAX_APP_DIFF_LINES" ]; then
                  echo "..."
                fi
                printf '```\n'
                echo "</details>"
                echo ""
                continue
              fi
              if diff -u "$base_file" "$target_file" > "/tmp/diff-$app.txt"; then
                # App unchanged between renders - skip it entirely
                continue
              fi
              app_diff_lines=$(wc -l < "/tmp/diff-$app.txt")
              echo "<details><summary>$app</summary><br>"
              echo ""
              printf '```diff\n'
              if [ "$app_diff_lines" -le "$MAX_APP_DIFF_LINES" ]; then
                cat "/tmp/diff-$app.txt"
              else
                head -n "$MAX_APP_DIFF_LINES" "/tmp/diff-$app.txt"
                echo "..."
              fi
              printf '```\n'
              echo "</details>"
              echo ""
            done
          } > output/diff.md

      - name: Post diff as comment
        run: |
          gh pr comment ${{ github.event.number }} --repo ${{ github.repository }} --body-file output/diff.md --edit-last || \
          gh pr comment ${{ github.event.number }} --repo ${{ github.repository }} --body-file output/diff.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
