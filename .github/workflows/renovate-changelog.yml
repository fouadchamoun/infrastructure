name: Renovate Changelog

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

concurrency:
  group: renovate-changelog-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changelog:
    if: contains(github.event.pull_request.labels.*.name, 'helm-chart')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install OpenCode (pinned version)
        run: npm install --global @opencode/cli@2.2.5

      - name: Analyze upstream image changelogs
        env:
          SCALEWAY_API_KEY: ${{ secrets.SCALEWAY_API_KEY }}
        run: |
          opencode run --standalone --model scaleway/deepseek-v4.1-flash-1017 <<'EOF'
          # Role
          You are analyzing Renovate Pull Request #${{ github.event.pull_request.number }} on ${{ github.repository }}
          to surface the upstream Docker image changes that ride along with a Helm chart update,
          and fetch the correct changelogs for those images.

          # Steps
          1. Confirm from the PR description that the PR updates a Helm chart.
            Identify the chart name and the version change (old -> new).
          2. In the Release Notes section, find upstream Docker image references with
            their NEW version/tag.
          3. Usually, the release notes include commit urls for these image updates.
          4. Determine the effective upstream image version change(s) (old -> new).
          5. For each changed image, fetch the correct changelog from its own project:
            prefer GitHub Releases/compare URLs, then Docker Hub / Quay / GHCR, then
            project docs. Use curl/webfetch (public sources) or gh.
          6. If upstream image itself is a "wrapper" for an upstream software (ex. homebridge-docker), then also fetch the changelog for that software as well.
          7. Output the changelog for each image as is, and without other commentary, in a comment on the PR.
          8. If no upstream image version change can be found, simply state that in the comment.

          # Constraints
          - Do NOT edit the PR description or any repository file.
          - Do NOT create branches, commit, or push.
          - You are running in a GitHub Actions environment in a public repo, do not run commands that could compromise security (ex. print secrets).
          - You have a timeout of 15 minutes to complete the task. No need to think too much.
          EOF
