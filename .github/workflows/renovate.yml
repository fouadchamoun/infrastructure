name: Renovate

on:
  schedule:
    - cron: '0 * * * *'
  push:
    branches:
      - main
  workflow_dispatch:
  # React quickly to interactive Renovate commands (checkbox ticks on the
  # dependency dashboard / in PR bodies, `@renovate ...` comment commands)
  # instead of waiting for the next scheduled run.
  issues:
    types: [edited]
  pull_request:
    types: [edited]
  issue_comment:
    types: [created, edited]

concurrency: 
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    # Always run for schedule/push/manual. For activity events, run only when a
    # human (not a bot) touched an issue/PR authored by the Renovate bot
    # (RENOVATE_BOT_LOGIN variable). Only one of pull_request/issue is populated
    # per event, so a single OR covers pull_request + issues + issue_comment.
    if: github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event.sender.type != 'Bot' && (github.event.pull_request.user.login == 'renovate-fchamoun[bot]' || github.event.issue.user.login == 'renovate-fchamoun[bot]'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Get Renovate GitHub App token
        id: renovate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        with:
          token: ${{ steps.renovate-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ALLOWED_COMMANDS: '["*"]'
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_PLATFORM_COMMIT: 'enabled' # sign commits
          LOG_LEVEL: debug
