seerr-chart:
  nameOverride: seerr
  image:
    registry: ghcr.io
    repository: seerr-team/seerr
  config:
    persistence:
      size: 1Gi
      storageClass: longhorn
      annotations:
        argocd.argoproj.io/sync-options: "Delete=false"
        argocd.argoproj.io/sync-wave: "-1"
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 4000m
      memory: 1024Mi
