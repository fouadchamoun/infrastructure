cloudflared:
  workload:
    main:
      type: Deployment
      replicas: 3
      strategy: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
        maxSurge: 0
      
      podSpec:
        containers:
          main:
            env:
              # https://developers.cloudflare.com/cloudflare-one/networks/connectors/cloudflare-tunnel/configure-tunnels/run-parameters
              TUNNEL_METRICS: 0.0.0.0:2000
              TUNNEL_TOKEN:
                secretKeyRef:
                  name: tunnel-token
                  key: token

            probes:
              # Cloudflared has a /ready endpoint which returns 200 if and only if
              # it has an active connection to Cloudflare's network.
              liveness:
                enabled: true
                port: 2000
                path: /ready
                spec:
                  initialDelaySeconds: 10
                  failureThreshold: 1
                  successThreshold: 1
                  timeoutSeconds: 5
                  periodSeconds: 10
      
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 4000m
      memory: 1024Mi
  
  secret:
    env-secrets:
      enabled: false
  
  externalSecret:
    tunnel-token:
      enabled: true
      refreshInterval: 1h
      secretStoreRef:
        kind: ClusterSecretStore
        name: scw-sm
      dataFrom:
        - extract:
            key: path:/cloudflare/tunnel/talos
