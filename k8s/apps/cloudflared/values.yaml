cloudflared:
  workload:
    main:
      type: Deployment
      replicas: 3
      strategy: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
        maxSurge: 0
      
      podSpec:
        containers:
          main:
            env:
              # https://developers.cloudflare.com/cloudflare-one/networks/connectors/cloudflare-tunnel/configure-tunnels/run-parameters
              TUNNEL_METRICS: 0.0.0.0:2000
            envFrom:
            - secretRef:
                name: "{{ .Release.Name }}-tunnel-token"
                expandObjectName: false

            probes:
              # Cloudflared has a /ready endpoint which returns 200 if and only if
              # it has an active connection to Cloudflare's network.
              readiness:
                enabled: true
                port: 2000
                path: /ready
                spec:
                  initialDelaySeconds: 10
                  failureThreshold: 1
                  successThreshold: 1
                  timeoutSeconds: 5
                  periodSeconds: 10
      
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 4000m
      memory: 1024Mi

  service:
    metrics:
      enabled: true
      primary: true
      ports:
        main:
          enabled: true
          primary: true
          targetSelector: main
          port: 2000

  metrics:
    main:
      enabled: true
      # primary: true
      targetSelector: metrics
      endpoints:
        - port: main
          interval: 30s

  secret:
    env-secrets:
      enabled: false

  extraTpl:
  - |
    apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: "{{ .Release.Name }}-tunnel-token"
    spec:
      secretStoreRef:
        kind: ClusterSecretStore
        name: scw-sm
      target:
        name: "{{ .Release.Name }}-tunnel-token"
        template:
          engineVersion: v2
          data:
            TUNNEL_TOKEN: "{{ "{{ .token }}" }}"
      refreshInterval: 1h
      dataFrom:
      - extract:
          key: path:/cloudflare/tunnel/talos


