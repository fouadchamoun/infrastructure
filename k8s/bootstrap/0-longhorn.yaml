---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: cluster-bootstrap
  destination:
    server: "https://kubernetes.default.svc"
    namespace: longhorn-system
  sources:
    - repoURL: https://charts.longhorn.io
      chart: longhorn
      targetRevision: 1.13.0
      helm:
        valuesObject:
          preUpgradeChecker:
            # -- Setting that allows Longhorn to perform pre-upgrade checks. Disable this setting when installing Longhorn using Argo CD or other GitOps solutions.
            jobEnabled: false
         
          # https://github.com/longhorn/charts/blob/longhorn-1.12.1/charts/longhorn/values.yaml#L260
          defaultSettings:
            defaultDataPath: /var/mnt/longhorn/
            nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
            storageOverProvisioningPercentage: 100
            storageMinimalAvailablePercentage: 25
            defaultDataLocality: best-effort
            concurrentAutomaticEngineUpgradePerNodeLimit: 3
          
          ingress:
            enabled: true
            host: longhorn.homelab.fouad.dev
            annotations: {}

          metrics:
            serviceMonitor:
              # -- Setting that allows the creation of a Prometheus ServiceMonitor resource for Longhorn Manager components.
              enabled: true

          networkPolicies:
            # -- Setting that allows you to enable network policies for internal Longhorn components. When enabled, only authorized Longhorn components are allowed to communicate with each other.
            restrictInternalTraffic: true # default
            # -- Sources permitted to scrape Longhorn Manager metrics on TCP/9500 when `restrictInternalTraffic` is enabled. Each entry is a NetworkPolicy peer. TCP/9500 also serves the Longhorn Manager REST API, so scope every entry as narrowly as the scraper allows, for example a `namespaceSelector` and a `podSelector` in one entry rather than a namespace on its own. When empty, only the Longhorn components already listed in the policy can reach Longhorn Manager.
            metricsScrapeSources:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: monitoring
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: prometheus

          persistence:
            createStorageClass: true
            defaultClass: true
            defaultFsType: ext4
            defaultClassReplicaCount: 2
            # -- Data locality of the default Longhorn StorageClass. (Options: "disabled", "best-effort")
            defaultDataLocality: best-effort
            # -- Reclaim policy that provides instructions for handling of a volume after its claim is released. (Options: "Retain", "Delete")
            reclaimPolicy: Delete
            # -- Setting that allows you to enable live migration of a Longhorn volume from one node to another.
            migratable: true
            # -- Setting that allows you to enable automatic snapshot removal during filesystem trim for a Longhorn StorageClass. (Options: "ignored", "enabled", "disabled")
            unmapMarkSnapChainRemoved: enabled
            # -- Setting that allows you to specify the data engine version for the default Longhorn StorageClass. (Options: "v1", "v2")
            dataEngine: v1
          
          defaultBackupStore:
            backupTarget: s3://fchamoun-longhorn-backup@fr-par/
            backupTargetCredentialSecret: longhorn-backupstore-credentials

          # -- Add extra objects manifests
          extraObjects:
          - apiVersion: storage.k8s.io/v1
            kind: StorageClass
            metadata:
              name: longhorn-live-migratable
              annotations:
                storageclass.kubevirt.io/is-default-virt-class: "true"
            provisioner: driver.longhorn.io
            allowVolumeExpansion: true
            reclaimPolicy: Retain
            volumeBindingMode: Immediate
            parameters:
              numberOfReplicas: "2"
              migratable: "true"
              dataLocality: "best-effort"
              dataEngine: "v1"
          
          - apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: longhorn-backupstore-credentials
            spec:
              secretStoreRef:
                kind: ClusterSecretStore
                name: scw-sm
              target:
                name: longhorn-backupstore-credentials
              refreshInterval: 60s
              dataFrom:
              - extract:
                  key: path:/longhorn/backupstore/credentials

          - apiVersion: monitoring.coreos.com/v1
            kind: PrometheusRule
            metadata:
              name: prometheus-longhorn-rules
              labels:
                prometheus: longhorn
                role: alert-rules
            spec:
              groups:
              - name: longhorn.rules
                rules:
                - alert: LonghornVolumeActualSpaceUsedWarning
                  annotations:
                    description: The actual space used by Longhorn volume {{ "{{$labels.volume}}" }} on {{ "{{$labels.node}}" }} is at {{ "{{$value}}" }}% capacity for
                      more than 5 minutes.
                    summary: The actual used space of Longhorn volume is over 90% of the capacity.
                  expr: (longhorn_volume_actual_size_bytes / longhorn_volume_capacity_bytes) * 100 > 90
                  for: 5m
                  labels:
                    issue: The actual used space of Longhorn volume {{ "{{$labels.volume}}" }} on {{ "{{$labels.node}}" }} is high.
                    severity: warning
                - alert: LonghornVolumeStatusCritical
                  annotations:
                    description: Longhorn volume {{ "{{$labels.volume}}" }} on {{ "{{$labels.node}}" }} is Fault for
                      more than 2 minutes.
                    summary: Longhorn volume {{ "{{$labels.volume}}" }} is Fault
                  expr: longhorn_volume_robustness == 3
                  for: 5m
                  labels:
                    issue: Longhorn volume {{ "{{$labels.volume}}" }} is Fault.
                    severity: critical
                - alert: LonghornVolumeStatusWarning
                  annotations:
                    description: Longhorn volume {{ "{{$labels.volume}}" }} on {{ "{{$labels.node}}" }} is Degraded for
                      more than 5 minutes.
                    summary: Longhorn volume {{ "{{$labels.volume}}" }} is Degraded
                  expr: longhorn_volume_robustness == 2
                  for: 5m
                  labels:
                    issue: Longhorn volume {{ "{{$labels.volume}}" }} is Degraded.
                    severity: warning
                - alert: LonghornNodeStorageWarning
                  annotations:
                    description: The used storage of node {{ "{{$labels.node}}" }} is at {{ "{{$value}}" }}% capacity for
                      more than 5 minutes.
                    summary:  The used storage of node is over 70% of the capacity.
                  expr: (longhorn_node_storage_usage_bytes / longhorn_node_storage_capacity_bytes) * 100 > 70
                  for: 5m
                  labels:
                    issue: The used storage of node {{ "{{$labels.node}}" }} is high.
                    severity: warning
                - alert: LonghornDiskStorageWarning
                  annotations:
                    description: The used storage of disk {{ "{{$labels.disk}}" }} on node {{ "{{$labels.node}}" }} is at {{ "{{$value}}" }}% capacity for
                      more than 5 minutes.
                    summary:  The used storage of disk is over 70% of the capacity.
                  expr: (longhorn_disk_usage_bytes / longhorn_disk_capacity_bytes) * 100 > 70
                  for: 5m
                  labels:
                    issue: The used storage of disk {{ "{{$labels.disk}}" }} on node {{ "{{$labels.node}}" }} is high.
                    severity: warning
                - alert: LonghornNodeDown
                  annotations:
                    description: There are {{ "{{$value}}" }} Longhorn nodes which have been offline for more than 5 minutes.
                    summary: Longhorn nodes is offline
                  expr: (avg(longhorn_node_count_total) or on() vector(0)) - (count(longhorn_node_status{condition="ready"} == 1) or on() vector(0)) > 0
                  for: 5m
                  labels:
                    issue: There are {{ "{{$value}}" }} Longhorn nodes are offline
                    severity: critical
                - alert: LonghornInstanceManagerCPUUsageWarning
                  annotations:
                    description: Longhorn instance manager {{ "{{$labels.instance_manager}}" }} on {{ "{{$labels.node}}" }} has CPU Usage / CPU request is {{ "{{$value}}" }}% for
                      more than 5 minutes.
                    summary: Longhorn instance manager {{ "{{$labels.instance_manager}}" }} on {{ "{{$labels.node}}" }} has CPU Usage / CPU request is over 300%.
                  expr: (longhorn_instance_manager_cpu_usage_millicpu/longhorn_instance_manager_cpu_requests_millicpu) * 100 > 300
                  for: 5m
                  labels:
                    issue: Longhorn instance manager {{ "{{$labels.instance_manager}}" }} on {{ "{{$labels.node}}" }} consumes 3 times the CPU request.
                    severity: warning
                - alert: LonghornNodeCPUUsageWarning
                  annotations:
                    description: Longhorn node {{ "{{$labels.node}}" }} has CPU Usage / CPU capacity is {{ "{{$value}}" }}% for
                      more than 5 minutes.
                    summary: Longhorn node {{ "{{$labels.node}}" }} experiences high CPU pressure for more than 5m.
                  expr: (longhorn_node_cpu_usage_millicpu / longhorn_node_cpu_capacity_millicpu) * 100 > 90
                  for: 5m
                  labels:
                    issue: Longhorn node {{ "{{$labels.node}}" }} experiences high CPU pressure.
                    severity: warning

  syncPolicy:
    managedNamespaceMetadata:
      labels: # The labels to set on the application namespace
        pod-security.kubernetes.io/enforce: privileged
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - ServerSideApply=true
      - FailOnSharedResource=true
      - RespectIgnoreDifferences=true
